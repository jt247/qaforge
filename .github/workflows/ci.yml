name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate product configs
        run: python tooling/lab.py validate
      - name: No enabled product targets may be committed
        run: |
          python - <<'PY'
          import json, pathlib, sys
          bad = [p for p in pathlib.Path('products').glob('*/product.json')
                 if any(e.get('enabled') for e in json.load(p.open())['environments'].values())]
          if bad:
              print('Enabled targets committed:', *bad); sys.exit(1)
          print('No enabled product targets committed.')
          PY

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
